<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <title>ICJIA Accessibility Portal</title>
  <!--
    Open Graph image template (1200x630), rendered to public/og-image.png by
    scripts/generate-og-image.js.

    Plakat look (November 2026), matching the site and audit.icjia.app: a
    near-black page, one purple block, Archivo set heavy and tight, a white
    outlined panel. The font is the self-hosted copy the site itself uses
    (@fontsource-variable/archivo), so rendering needs no network.

    The image shows the deadline date, not the days remaining, so it never
    goes stale.
  -->
  <style>
    @font-face {
      font-family: "Archivo Variable";
      font-style: normal;
      font-weight: 100 900;
      src: url("../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2") format("woff2-variations");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0a0a0a;
      color: #ffffff;
      font-family: "Archivo Variable", "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      gap: 28px;
      padding: 44px;
    }

    .label {
      font-size: 17px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* The purple block: white on #62498d is 7.4:1. */
    .block {
      flex: 1.5 1 0;
      background: #62498d;
      padding: 40px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .block-top {
      display: flex;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      font-size: 104px;
      line-height: 0.92;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .url {
      font-size: 24px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    /* The outlined panel: the deadline. */
    .panel {
      flex: 1 1 0;
      border: 4px solid #ffffff;
      padding: 36px 36px 32px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 22px;
    }

    .panel .label {
      color: #d4d4d4;
    }

    .month {
      font-size: 84px;
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .day {
      font-size: 236px;
      line-height: 0.8;
      font-weight: 800;
      letter-spacing: -0.06em;
      margin-left: -8px;
    }

    .year {
      border-top: 4px solid #ffffff;
      padding-top: 14px;
      font-size: 64px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.05em;
    }
  </style>
</head>
<body>
  <div class="block">
    <div class="block-top label">
      <span>Illinois Criminal Justice Information Authority</span>
    </div>
    <h1>ICJIA Accessibility Portal</h1>
    <div class="url">accessibility.icjia.app</div>
  </div>
  <div class="panel">
    <div class="label">ADA Title II deadline · WCAG 2.1 AA</div>
    <div class="month">April</div>
    <div class="day">26</div>
    <div class="year">2027</div>
  </div>
</body>
</html>
